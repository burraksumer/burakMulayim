name: Tests

# The expensive half of CI: unit tests and the containerized e2e suite. Split
# out of ci.yml so it can be path-filtered independently — e2e builds both
# images from scratch and is by far the slowest thing here.
#
# paths-ignore rather than paths, deliberately. With `paths` you must enumerate
# everything that matters, and anything forgotten — a new top-level directory,
# a new workspace — silently stops being tested. With paths-ignore, anything not
# listed still triggers, so mistakes fail safe by running the suite.
#
# The ignore list is intentionally tiny. In particular apps/server/content/** is
# NOT ignored: posts are served by the API and the e2e specs assert on post and
# tag counts derived from their frontmatter, so a content edit can legitimately
# break them.
#
# Dependabot PRs are skipped for the same reason as in ci.yml — they cannot read
# LASTFM_API_KEY, so e2e could never pass.
on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "apps/*/README.md"
      - "**/.env.example"
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "apps/*/README.md"
      - "**/.env.example"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in lockstep with `packageManager` in package.json and the oven/bun tags
  # in apps/*/Dockerfile.
  BUN_VERSION: "1.3.14"

jobs:
  unit:
    name: Unit tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No secrets needed: specs import modules directly, and the only consumer
      # of @burakmulayim/env (apps/server/src/index.ts) is never imported here.
      - name: Run unit tests
        run: bun run test

  e2e:
    name: E2E (containerized)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Only needed so `bun run --filter e2e` can resolve the workspace; the
      # suite itself runs entirely inside containers.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # docker-compose.yml is invoked with `--env-file ../../.env.local`, which
      # is gitignored. Recreate the minimum it needs. Passed via env rather than
      # interpolated into the script body so the value never lands in the
      # command line.
      - name: Materialize .env.local for compose
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > .env.local

      # Builds web + server images, waits on their healthchecks, runs Playwright
      # on the same Docker network. No host ports, no host browsers.
      - name: Run e2e suite
        run: bun run test:e2e:docker

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-test-results
          path: apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      # `compose run` leaves web/server up; drop them and the data volume so a
      # re-run never inherits a warm upstream_cache.
      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.local -f docker-compose.yml --profile test down -v
