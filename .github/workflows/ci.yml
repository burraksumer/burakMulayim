name: CI

# Static checks that are cheap and depend on nothing outside the repo, so they
# run on every pull request without a path filter. The test suites live in
# tests.yml, which is path-filtered because it is far more expensive.
#
# Note lint deliberately has no path filter: `check:ci` runs `prettier --check .`
# and .prettierignore excludes only JS/TS, so README and other markdown are
# genuinely validated here. Filtering this workflow on source paths would skip
# the only job that checks a docs-only change.
#
# Jobs are deliberately independent: no `needs:` edges, no shared state, no
# reusable composite action hiding the setup. Each job does its own checkout,
# pins its own toolchain, and installs its own dependencies, so a single job can
# be re-run, disabled, or reasoned about without touching the others. The
# duplication between jobs is the point — every layer stays visible and editable
# in place.

# Dependabot PRs are deliberately not built: they run with a separate secret
# store, so LASTFM_API_KEY resolves empty and the e2e job cannot pass. Each job
# carries the actor guard rather than filtering here, because `on:` cannot
# express it.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# One in-flight run per ref. A new push supersedes the previous run instead of
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repo.
permissions:
  contents: read

env:
  # Keep in lockstep with `packageManager` in package.json and the oven/bun tags
  # in apps/*/Dockerfile.
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: Lint & format
    if: github.actor != 'dependabot[bot]'
    # Pinned rather than ubuntu-latest so a runner image rollout can't change
    # results underneath us.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: oxlint + oxfmt + prettier
        run: bun run check:ci

  types:
    name: Type check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsc 7 for server/shared, astro check on TypeScript 6 for web.
      - name: Type check
        run: bun run check-types

  build:
    name: Build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        run: bun run build
