name: CI

# Every gate that currently lives in .husky/pre-commit, plus the e2e suite the
# hook never runs. Jobs are deliberately independent: no `needs:` edges, no
# shared state, no reusable composite action hiding the setup. Each job does its
# own checkout, pins its own toolchain, and installs its own dependencies, so a
# single job can be re-run, disabled, or reasoned about without touching the
# others. The duplication between jobs is the point — every layer stays visible
# and editable in place.

# Dependabot PRs are deliberately not built: they run with a separate secret
# store, so LASTFM_API_KEY resolves empty and the e2e job cannot pass. Each job
# carries the actor guard rather than filtering here, because `on:` cannot
# express it.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# One in-flight run per ref. A new push supersedes the previous run instead of
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repo.
permissions:
  contents: read

env:
  # Keep in lockstep with `packageManager` in package.json and the oven/bun tags
  # in apps/*/Dockerfile.
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: Lint & format
    if: github.actor != 'dependabot[bot]'
    # Pinned rather than ubuntu-latest so a runner image rollout can't change
    # results underneath us.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: oxlint + oxfmt + prettier
        run: bun run check:ci

  types:
    name: Type check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsc 7 for server/shared, astro check on TypeScript 6 for web.
      - name: Type check
        run: bun run check-types

  unit:
    name: Unit tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No secrets needed: specs import modules directly, and the only consumer
      # of @burakmulayim/env (apps/server/src/index.ts) is never imported here.
      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        run: bun run build

  e2e:
    name: E2E (containerized)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Only needed so `bun run --filter e2e` can resolve the workspace; the
      # suite itself runs entirely inside containers.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # docker-compose.yml is invoked with `--env-file ../../.env.local`, which
      # is gitignored. Recreate the minimum it needs. Passed via env rather than
      # interpolated into the script body so the value never lands in the
      # command line.
      - name: Materialize .env.local for compose
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > .env.local

      # Builds web + server images, waits on their healthchecks, runs Playwright
      # on the same Docker network. No host ports, no host browsers.
      - name: Run e2e suite
        run: bun run test:e2e:docker

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-test-results
          path: apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      # `compose run` leaves web/server up; drop them and the data volume so a
      # re-run never inherits a warm upstream_cache.
      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.local -f docker-compose.yml --profile test down -v
