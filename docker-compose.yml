# Coolify reads this file as a "Docker Compose" application.
# Both services share an automatic Docker network; `web` reaches `server`
# by service name (http://server:3000) without going through the public proxy.
#
# Coolify-specific labels map services to public domains. The label syntax
# below works with Coolify v4's built-in proxy. Adjust if your Coolify uses
# a different proxy backend.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    expose:
      - "3000"
    volumes:
      - data:/data
    environment:
      DATABASE_URL: /data/local.db
      POSTS_DIR: /app/apps/server/content/posts
      CORS_ORIGIN: https://burak.mulayim.app
      WEBSITECARBON_URL: https://burak.mulayim.app
      WEBSITECARBON_GREEN: "true"
      LASTFM_USER: buraksumer13
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - coolify.managed=true
      - coolify.proxy.host=api.mulayim.app
      - coolify.proxy.port=3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "4321"
    environment:
      PUBLIC_SERVER_URL: http://server:3000
      NODE_ENV: production
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.proxy.host=burak.mulayim.app
      - coolify.proxy.port=4321

volumes:
  data:
